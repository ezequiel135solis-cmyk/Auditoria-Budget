<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portal de Auditoría Budget</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b2a55;color:#fff;font:15px "Segoe UI",system-ui,sans-serif}.b{text-align:center;padding:24px}.w{font:800 30px/1 "Segoe UI",sans-serif;color:#f26722}.m{margin-top:14px;color:#c9d6ec}.e{margin-top:14px;background:#fff;color:#7a1b12;border-radius:8px;padding:12px 16px;max-width:520px}</style>
<script src="config.js"></script><script src="app/app_local.js"></script></head>
<body><div class="b"><div class="w">Budget</div><div>Portal de Auditoría</div><div class="m" id="m">Buscando la última versión…</div></div>
<script>
/* Lanzador fijo: no hace falta cambiar este archivo. Toma la versión más reciente de la aplicación
   (GitHub > copia guardada en el equipo > copia de la carpeta app) y la abre. */
(function(){
 var C=window.PORTAL_CFG||{},local=window.__APP_LOCAL||'';try{delete window.__APP_LOCAL}catch(e){window.__APP_LOCAL=null}
 window.__PORTAL_FOLDER=true;
 function ver(h){var m=/VER=\{n:(\d+)/.exec(h||'');return m?+m[1]:0}
 function db(cb){try{var q=indexedDB.open('portal_lanzador',1);q.onupgradeneeded=function(){q.result.createObjectStore('s')};q.onsuccess=function(){cb(q.result)};q.onerror=function(){cb(null)}}catch(e){cb(null)}}
 function cacheGet(){return new Promise(function(ok){db(function(d){if(!d)return ok(null);try{var r=d.transaction('s').objectStore('s').get('app');r.onsuccess=function(){ok(r.result||null)};r.onerror=function(){ok(null)}}catch(e){ok(null)}})})}
 function cachePut(h){db(function(d){if(!d)return;try{d.transaction('s','readwrite').objectStore('s').put(h,'app')}catch(e){}})}
 var url=C.owner&&C.repo?'https://raw.githubusercontent.com/'+C.owner+'/'+C.repo+'/'+(C.branch||'main')+'/'+(C.file||'app/reporte_auditoria.html')+'?t='+Date.now():'';
 var remote=url?Promise.race([fetch(url,{cache:'no-store'}).then(function(r){return r.ok?r.text():null}).catch(function(){return null}),new Promise(function(ok){setTimeout(function(){ok(null)},C.timeout||8000)})]):Promise.resolve(null);
 Promise.all([remote,cacheGet()]).then(function(a){var r=a[0],c=a[1],best=local,src='carpeta';
  if(c&&ver(c)>ver(best)){best=c;src='copia del equipo'}
  if(r&&/<\/html>\s*$/i.test(r)&&ver(r)>=ver(best)){best=r;src='GitHub';cachePut(r)}
  if(!best){document.getElementById('m').outerHTML='<div class="e">No se encontró la aplicación. Verifica que la carpeta <b>app</b> esté junto a este archivo.</div>';return}
  window.__PORTAL_SRC=src;window.__PORTAL_VER=ver(best);document.open();document.write(best);document.close()});
})();
</script></body></html>
